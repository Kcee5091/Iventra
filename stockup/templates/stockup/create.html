
  
{% extends "stockup/base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}

<div class="container mt-4" >

    <h2>Add New Product</h2>

    <form method="POST" action="{% url 'create'%}">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-dark">
            Save Product
        </button>
    </form>

</div>

{% endblock %}
